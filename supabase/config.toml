# Supabase Local Configuration
project_id = "qa-snapshot-editor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.qa-ephemeral-snapshots]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[functions.monday-oauth]
verify_jwt = false

[functions.parity-account]
verify_jwt = false

[functions.parity-account-v2]
# The handler verifies Supabase access tokens with auth.getUser().
verify_jwt = false

[storage.buckets.qa-evidence]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/webp", "image/png", "image/jpeg"]

[functions.qa-evidence]
# Uploads are authenticated by the handler with auth.getUser(); downloads are public by design,
# protected by an unguessable id and an expiry, like a screenshot-sharing link.
verify_jwt = false
