name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    name: Desktop build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  visual-worker-build:
    name: OpenCV worker build (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r python/requirements.txt
      - run: python -m compileall -q python
      - run: python -m PyInstaller --noconfirm --clean --onefile --name visual-compare --distpath resources/visual-worker --workpath .python-build --specpath .python-build python/visual_compare.py
      - name: Verify packaged worker
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/visual-worker/visual-compare.exe")) {
            throw "The packaged OpenCV worker was not created."
          }

  viewer-build:
    name: Viewer build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key
      VITE_EPHEMERAL_VIEWER_URL: https://parity-rz8.pages.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:viewer

  migration-test:
    name: Supabase migration test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
      - name: Start local database
        run: supabase db start
      - name: Apply migrations from a clean database
        run: supabase db reset
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
