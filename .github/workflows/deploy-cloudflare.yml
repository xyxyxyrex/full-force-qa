name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - viewer/**
      - scripts/build-viewer.js
      - src/renderer/src/assets/parity-180.png
      - src/renderer/src/assets/parity-192.png
      - src/renderer/src/assets/parity-512.png
      - src/renderer/src/assets/parity-favicon.svg
      - wrangler.jsonc
      - package.json
      - package-lock.json
      - .github/workflows/deploy-cloudflare.yml
  workflow_run:
    workflows: [Release Desktop App]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and deploy viewer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_EPHEMERAL_VIEWER_URL: ${{ secrets.VITE_EPHEMERAL_VIEWER_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing VITE_SUPABASE_ANON_KEY"; exit 1; }
          test "$VITE_EPHEMERAL_VIEWER_URL" = "https://parity-gfx.pages.dev" || { echo "VITE_EPHEMERAL_VIEWER_URL must be https://parity-gfx.pages.dev"; exit 1; }
      - run: npm ci
      - run: npm run build:viewer
      - name: Validate landing page installer
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -f dist-viewer/install.ps1
          grep -F "v$VERSION" dist-viewer/index.html
          grep -F "\$FallbackVersion = '$VERSION'" dist-viewer/install.ps1
          ! grep -R "__PARITY_VERSION__" dist-viewer
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist-viewer --project-name=parity-gfx --branch=${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }} --commit-hash=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
