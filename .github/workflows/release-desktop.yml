name: Release Desktop App

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new tag matching package.json, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows update
    runs-on: windows-latest
    timeout-minutes: 60
    environment: production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_EPHEMERAL_VIEWER_URL: ${{ secrets.VITE_EPHEMERAL_VIEWER_URL }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate release tag and package version
        shell: pwsh
        run: |
          $expected = "v$(node -p "require('./package.json').version")"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag '$env:RELEASE_TAG' must match package version '$expected'."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) {
            throw "Missing VITE_SUPABASE_URL in the production environment."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) {
            throw "Missing VITE_SUPABASE_ANON_KEY in the production environment."
          }
          if ($env:VITE_EPHEMERAL_VIEWER_URL -ne "https://parity-gfx.pages.dev") {
            throw "VITE_EPHEMERAL_VIEWER_URL must be https://parity-gfx.pages.dev."
          }
      - run: npm ci
      - name: Build landing page installer
        run: npm run build:viewer
      - name: Install visual comparison builder
        run: python -m pip install -r python/requirements.txt
      - name: Build installer and update artifacts
        run: npm run build:dist
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "dist/Parity-Setup-$version.exe"
            "dist/Parity-Setup-$version.exe.blockmap"
            "dist/latest.yml"
            "dist-viewer/install.ps1"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing required release asset: $asset"
            }
          }

          $null = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "Parity v$version" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed."
          }
      - name: Archive release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: parity-${{ env.RELEASE_TAG }}-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
