<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Snapshot Viewer</title>
  <style>
    :root { --bg:#09090b; --card:#121215; --elevated:#18181c; --border:#2b2b30; --accent:#ff0055; --text:#f4f4f5; --muted:#a1a1aa; --danger:#f87171; --success:#4ade80; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:28px 16px 56px; background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea,select { font:inherit; }
    .page { width:min(1180px,100%); margin:auto; }
    .header { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    .logo { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--border); border-radius:9px; background:var(--elevated); color:var(--accent); }
    h1 { margin:0; font-size:20px; }
    .viewer { overflow:hidden; border:1px solid var(--border); border-radius:15px; background:var(--card); box-shadow:0 22px 55px #0009; }
    .titlebar { min-height:39px; display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid var(--border); background:var(--elevated); }
    .dot { width:11px; height:11px; border-radius:50%; }
    .dot.red{background:#ff5f56}.dot.yellow{background:#ffbd2e}.dot.green{background:#27c93f}
    .path { margin-left:10px; overflow:hidden; color:var(--muted); font:12px monospace; text-overflow:ellipsis; white-space:nowrap; }
    .body { display:grid; grid-template-columns:minmax(0,1fr) 330px; min-height:560px; }
    .content { min-width:0; padding:24px; border-right:1px solid var(--border); }
    .sidebar { padding:20px; background:#101012; }
    .meta { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .badge { display:inline-flex; margin-bottom:6px; padding:5px 12px; border:1px solid var(--accent); border-radius:999px; background:#ff005522; color:var(--accent); font-size:12px; font-weight:800; }
    h2 { margin:0; font-size:22px; line-height:1.25; }
    .expiry { flex:0 0 auto; padding-top:7px; color:var(--muted); font-size:12px; }
    .capture-size { display:flex; flex-wrap:wrap; gap:7px; margin:-8px 0 16px; color:var(--muted); font-size:11px; }
    .capture-size span { padding:5px 9px; border:1px solid var(--border); border-radius:999px; background:var(--elevated); }
    .capture-size strong { color:#67e8f9; }
    .preview { min-height:280px; display:grid; place-items:center; overflow:auto; border:1px solid var(--border); border-radius:11px; background:#050505; }
    .image-stage { position:relative; display:inline-block; max-width:100%; line-height:0; }
    .image-stage img { display:block; max-width:100%; height:auto; }
    .inspection-layer,.annotation-layer { position:absolute; inset:0; pointer-events:none; }
    .inspection-layer { z-index:1; }
    .annotation-layer { z-index:2; }
    .inspection-overlay { position:absolute; box-sizing:border-box; pointer-events:none; }
    .inspection-overlay.boundary { min-width:1px; min-height:1px; border:1px solid rgba(59,130,246,.82); background:rgba(59,130,246,.025); }
    .inspection-overlay.font>span,.inspection-overlay.boundary>span { position:absolute; top:-22px; left:0; min-height:20px; max-width:380px; padding:4px 7px; overflow:hidden; border:1px solid #ffffff38; border-radius:4px; background:#111113f2; color:#fff; box-shadow:0 2px 7px #0009; font:700 12px/1 Inter,system-ui,sans-serif; text-overflow:ellipsis; white-space:nowrap; }
    .inspection-overlay.font>span { border-color:#ec489980; color:#f9a8d4; }
    .inspection-overlay.guide { min-width:1px; min-height:1px; background:#22d3ee; box-shadow:0 0 0 1px #0891b638; }
    .inspection-overlay.ruler-top { border-bottom:1px solid #52525b; background:repeating-linear-gradient(90deg,#71717a 0 1px,transparent 1px 10px),#18181b; opacity:.92; }
    .inspection-overlay.ruler-left { border-right:1px solid #52525b; background:repeating-linear-gradient(0deg,#71717a 0 1px,transparent 1px 10px),#18181b; opacity:.92; }
    .annotation { position:absolute; min-width:8px; min-height:8px; padding:0; border:2px dashed var(--status-color,#9ca3af); border-radius:4px; background:color-mix(in srgb,var(--status-color,#9ca3af) 12%,transparent); cursor:pointer; pointer-events:auto; }
    .annotation:hover,.annotation.active { border-style:solid; box-shadow:0 0 0 3px color-mix(in srgb,var(--status-color,#9ca3af) 25%,transparent); }
    .annotation.circle { border-radius:50%; }
    .annotation.arrow,.annotation.pen,.annotation.text,.annotation.blur { border:0; background:transparent; }
    .annotation-shape-svg,.annotation-shape-blur { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .annotation-shape-svg [data-status-stroke] { stroke:var(--status-color,#9ca3af); }
    .annotation-shape-svg [data-status-fill] { fill:var(--status-color,#9ca3af); }
    .annotation-shape-text { position:absolute; inset:0; overflow:hidden; padding:7px 9px; border-left:3px solid var(--status-color,#9ca3af); border-radius:4px; background:#111113e8; color:#fff; font:700 13px/1.35 Inter,system-ui,sans-serif; text-align:left; }
    .annotation-shape-blur { border:1px dashed var(--status-color,#9ca3af); border-radius:4px; background:#52525bad; backdrop-filter:blur(10px); }
    .annotation.pulse { animation:annotationPulse 1.15s ease-out; }
    @keyframes annotationPulse { 0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--status-color,#9ca3af) 25%,transparent)} 45%{box-shadow:0 0 0 12px color-mix(in srgb,var(--status-color,#9ca3af) 45%,transparent);filter:brightness(1.3)} }
    .annotation-label { position:absolute; top:-25px; left:-2px; max-width:220px; padding:3px 7px; border-radius:4px; background:var(--status-color,#9ca3af); color:var(--status-foreground,#fff); font:700 11px/1.3 system-ui; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .message { max-width:620px; padding:22px; text-align:center; color:var(--muted); }
    .message.error { color:var(--danger); }
    .retry { margin-top:12px; }
    .notes { margin-top:16px; padding:14px; border:1px solid var(--border); border-radius:9px; background:var(--elevated); color:#e4e4e7; }
    .actions { display:flex; justify-content:flex-end; margin-top:16px; }
    .btn { min-height:36px; padding:8px 14px; border:1px solid #3f3f46; border-radius:7px; background:#27272a; color:white; font-weight:700; cursor:pointer; }
    .btn:hover:not(:disabled){filter:brightness(1.13)} .btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{border-color:var(--accent);background:var(--accent)}
    .sidebar h3 { margin:0 0 5px; font-size:16px; }
    .sidebar-intro { margin:0 0 16px; color:var(--muted); font-size:12px; }
    .annotation-picker { display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
    .annotation-choice { width:100%; display:flex; align-items:center; gap:8px; padding:4px; border:1px solid color-mix(in srgb,var(--status-color,#9ca3af) 55%,var(--border)); border-radius:7px; background:color-mix(in srgb,var(--status-color,#9ca3af) 7%,var(--elevated)); color:var(--text); }
    .annotation-choice.active { border-color:var(--status-color,#9ca3af); box-shadow:0 0 0 2px color-mix(in srgb,var(--status-color,#9ca3af) 20%,transparent); }
    .annotation-jump { min-width:0; flex:1; padding:6px; border:0; background:transparent; color:inherit; text-align:left; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .status-select { flex:0 0 auto; width:112px; min-height:30px; padding:4px 24px 4px 7px; border:1px solid var(--status-color,#9ca3af); border-radius:5px; outline:0; background:#09090b; color:var(--status-color,#9ca3af); font-size:11px; font-weight:800; cursor:pointer; }
    .status-select:focus { box-shadow:0 0 0 2px color-mix(in srgb,var(--status-color,#9ca3af) 28%,transparent); }
    .status-select option { background:#18181c; color:#f4f4f5; }
    .comments { display:flex; flex-direction:column; gap:9px; max-height:270px; margin:12px 0 17px; overflow:auto; }
    .comment { padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--elevated); }
    .comment-head { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .comment-author { font-weight:800; }
    .comment-time { color:var(--muted); font-size:10px; }
    .comment-body { color:#ddd; overflow-wrap:anywhere; }
    .empty { padding:12px 0; color:var(--muted); font-size:12px; }
    .form { display:flex; flex-direction:column; gap:8px; }
    .field { width:100%; border:1px solid #3f3f46; border-radius:7px; outline:0; background:#09090b; color:white; padding:9px 10px; }
    .field:focus { border-color:var(--accent); }
    .rich-box { position:relative; border:1px solid #3f3f46; border-radius:7px; background:#09090b; }
    .rich-box:focus-within { border-color:var(--accent); box-shadow:0 0 0 1px #ff005540; }
    .rich-toolbar { display:flex; flex-wrap:wrap; gap:3px; padding:5px; border-bottom:1px solid var(--border); background:#18181c; border-radius:7px 7px 0 0; }
    .rich-toolbar button { min-width:27px; height:27px; padding:2px 6px; border:1px solid transparent; border-radius:4px; background:transparent; color:#d4d4d8; font-size:10px; font-weight:800; cursor:pointer; }
    .rich-toolbar button:hover { border-color:#52525b; background:#27272a; color:white; }
    .rich-editor { min-height:96px; max-height:260px; padding:9px 10px; overflow:auto; outline:0; color:white; line-height:1.5; overflow-wrap:anywhere; }
    .rich-editor:empty::before { color:#71717a; content:attr(data-placeholder); pointer-events:none; }
    .rich-content p,.rich-editor p { margin:0 0 7px; }.rich-content p:last-child,.rich-editor p:last-child{margin-bottom:0}
    .rich-content ul,.rich-content ol,.rich-editor ul,.rich-editor ol { margin:5px 0; padding-left:22px; }
    .rich-content a,.rich-editor a { color:#38bdf8; text-decoration:underline; }
    .rich-content img,.rich-editor img { display:block; max-width:100%; max-height:360px; margin:8px 0; border:1px solid #3f3f46; border-radius:7px; object-fit:contain; }
    .rich-content img,#image { cursor:zoom-in; }
    .rich-status { min-height:17px; padding:2px 8px 5px; color:var(--muted); font-size:10px; }
    .link-dialog { position:absolute; left:8px; right:8px; z-index:8; display:grid; gap:8px; margin-top:7px; padding:11px; border:1px solid #52525b; border-radius:8px; background:#202024; box-shadow:0 14px 34px #000c; }
    .link-dialog[hidden] { display:none; }
    .link-dialog label { display:grid; grid-template-columns:82px 1fr; align-items:center; gap:7px; color:var(--muted); font-size:10px; font-weight:800; }
    .link-dialog input { min-width:0; padding:7px 8px; border:1px solid #52525b; border-radius:5px; outline:0; background:#09090b; color:white; }
    .link-dialog>div { display:flex; justify-content:flex-end; gap:6px; }
    .link-dialog button { padding:5px 10px; border:1px solid #52525b; border-radius:5px; background:#27272a; color:white; cursor:pointer; }
    .link-dialog button.primary { border-color:#0ea5e9; background:#0284c7; }
    .form-status { min-height:19px; color:var(--muted); font-size:11px; }
    .form-status.error { color:var(--danger); }.form-status.success{color:var(--success)}
    .toast { position:fixed; bottom:24px; left:50%; z-index:10; padding:10px 18px; border:1px solid #3f3f46; border-radius:999px; background:#27272a; opacity:0; transform:translate(-50%,10px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .lightbox { position:fixed; inset:0; z-index:1000; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:12px; padding:20px; background:#000e; backdrop-filter:blur(8px); }
    .lightbox[hidden] { display:none; }
    .lightbox-close { justify-self:end; width:42px; height:42px; display:grid; place-items:center; padding:0; border:1px solid #ffffff38; border-radius:999px; background:#18181cd9; color:white; font-size:28px; line-height:1; cursor:pointer; }
    .lightbox-close:hover,.lightbox-close:focus-visible { border-color:white; background:#27272a; outline:0; }
    .lightbox-image-wrap { min-height:0; display:grid; place-items:center; }
    .lightbox img { max-width:min(96vw,1600px); max-height:calc(100vh - 118px); border-radius:8px; object-fit:contain; box-shadow:0 24px 80px #000; }
    .lightbox-caption { min-height:20px; color:#d4d4d8; text-align:center; overflow-wrap:anywhere; }
    @media(max-width:820px){.body{grid-template-columns:1fr}.content{border-right:0;border-bottom:1px solid var(--border)}.sidebar{padding:18px}.meta{flex-direction:column}.expiry{padding-top:0}}
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <h1>QA Snapshot Viewer</h1>
    </header>

    <section class="viewer">
      <div class="titlebar"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="path" id="path">Loading snapshot…</span></div>
      <div class="body">
        <div class="content">
          <div class="meta">
            <div><span class="badge" id="badge">QA SNAPSHOT</span><h2 id="title">Loading capture…</h2></div>
            <div class="expiry" id="expiry"></div>
          </div>
          <div class="capture-size" id="captureSize" hidden></div>
          <div class="preview" id="preview">
            <div class="message" id="message">Loading the captured site and annotations…</div>
            <div class="image-stage" id="stage" hidden>
              <img id="image" alt="QA site capture">
              <div class="inspection-layer" id="inspectionLayer"></div>
              <div class="annotation-layer" id="annotationLayer"></div>
            </div>
          </div>
          <div class="notes" id="notes" hidden></div>
          <div class="actions"><button class="btn primary" id="copy">Copy Link</button></div>
        </div>

        <aside class="sidebar">
          <h3>Annotation comments</h3>
          <p class="sidebar-intro" id="commentContext">Select an annotation to view its discussion.</p>
          <div class="annotation-picker" id="annotationPicker"></div>
          <div class="comments" id="comments"><div class="empty">Comments will appear here.</div></div>
          <form class="form" id="commentForm">
            <input class="field" id="author" maxlength="80" autocomplete="name" placeholder="Your name" required>
            <div class="rich-box">
              <div class="rich-toolbar" id="commentToolbar" role="toolbar" aria-label="Comment formatting">
                <button type="button" data-command="bold" title="Bold">B</button>
                <button type="button" data-command="italic" title="Italic">I</button>
                <button type="button" data-command="underline" title="Underline">U</button>
                <button type="button" data-command="strikeThrough" title="Strikethrough">S</button>
                <button type="button" data-command="insertUnorderedList" title="Bulleted list">• List</button>
                <button type="button" data-command="insertOrderedList" title="Numbered list">1. List</button>
                <button type="button" id="commentLink" title="Attach link">Link</button>
                <button type="button" id="commentImage" title="Attach compressed image">Image</button>
                <input id="commentImageInput" type="file" accept="image/*" multiple hidden>
              </div>
              <div class="rich-editor" id="commentBody" contenteditable="true" role="textbox" aria-label="Comment" aria-multiline="true" data-placeholder="Add a clear QA comment…"></div>
              <div class="rich-status" id="richStatus"></div>
              <div class="link-dialog" id="linkDialog" role="dialog" aria-label="Attach link" hidden>
                <label>Display Text<input id="linkText" autocomplete="off"></label>
                <label>URL<input id="linkUrl" type="url" placeholder="https://example.com" autocomplete="url"></label>
                <div><button type="button" id="cancelLink">Cancel</button><button type="button" class="primary" id="applyLink">Apply</button></div>
              </div>
            </div>
            <div class="form-status" id="formStatus"></div>
            <button class="btn primary" id="submitComment" type="submit">Post Comment</button>
          </form>
        </aside>
      </div>
    </section>
  </main>
  <div class="lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox-close" id="closeLightbox" type="button" aria-label="Close image preview">&times;</button>
    <div class="lightbox-image-wrap"><img id="lightboxImage" alt=""></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = __SUPABASE_URL__;
    const SUPABASE_ANON_KEY = __SUPABASE_ANON_KEY__;
    const BUCKET = 'qa-ephemeral-snapshots';
    const params = new URLSearchParams(location.search);
    const state = {
      site: params.get('site') || '',
      masterId: params.get('id') || '',
      itemNumber: Math.max(0, Number.parseInt(params.get('item') || '0', 10) || 0),
      snapshot: null,
      annotations: [],
      inspections: [],
      activeAnnotationId: '',
      statuses: {},
      objectUrls: new Set(),
    };
    const STATUS_OPTIONS = [
      { value:'requested', label:'Requested', color:'#9ca3af', foreground:'#111827' },
      { value:'in_progress', label:'In Progress', color:'#eab308', foreground:'#111827' },
      { value:'completed', label:'Completed', color:'#3b82f6', foreground:'#ffffff' },
      { value:'rejected', label:'Rejected', color:'#ef4444', foreground:'#ffffff' },
      { value:'approved', label:'Approved', color:'#22c55e', foreground:'#052e16' },
      { value:'invalid', label:'Invalid', color:'#a855f7', foreground:'#ffffff' },
      { value:'enhancement', label:'Enhancement', color:'#f97316', foreground:'#431407' },
      { value:'pm_clarification', label:'PM Clarification', color:'#ec4899', foreground:'#ffffff' },
    ];

    const el = (id) => document.getElementById(id);
    const configured = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(SUPABASE_URL) && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('__');
    const headers = () => ({ apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` });
    const filter = (value) => encodeURIComponent(value);

    function showToast(text) {
      el('toast').textContent = text;
      el('toast').classList.add('show');
      setTimeout(() => el('toast').classList.remove('show'), 2400);
    }

    function openImageLightbox(image) {
      const source = image.currentSrc || image.src;
      if (!source) return;
      const label = image.alt || 'Image preview';
      el('lightboxImage').src = source;
      el('lightboxImage').alt = label;
      el('lightboxCaption').textContent = image.alt || '';
      el('imageLightbox').hidden = false;
      document.body.style.overflow = 'hidden';
      el('closeLightbox').focus();
    }

    function closeImageLightbox() {
      if (el('imageLightbox').hidden) return;
      el('imageLightbox').hidden = true;
      el('lightboxImage').removeAttribute('src');
      document.body.style.removeProperty('overflow');
    }

    function showError(message, retry) {
      el('stage').hidden = true;
      el('message').hidden = false;
      el('message').className = 'message error';
      el('message').textContent = message;
      if (retry) {
        const button = document.createElement('button');
        button.className = 'btn retry';
        button.textContent = 'Retry';
        button.addEventListener('click', retry, { once: true });
        el('message').append(document.createElement('br'), button);
      }
    }

    async function api(path, options = {}) {
      if (!configured) throw new Error('The snapshot viewer is missing its Supabase configuration.');
      const response = await fetch(`${SUPABASE_URL}${path}`, {
        ...options,
        headers: { ...headers(), 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      if (!response.ok) {
        let detail = '';
        try { const body = await response.json(); detail = body.message || body.error || body.msg || ''; } catch (_) {}
        throw new Error(detail || `Snapshot service returned ${response.status}.`);
      }
      if (response.status === 204) return null;
      const text = await response.text();
      return text ? JSON.parse(text) : null;
    }

    function safeLink(value) {
      const trimmed = String(value || '').trim();
      if (!trimmed) return '';
      const normalized = /^[a-z][a-z\d+.-]*:/i.test(trimmed) ? trimmed : `https://${trimmed}`;
      try {
        const url = new URL(normalized);
        return ['http:','https:','mailto:'].includes(url.protocol) ? url.href : '';
      } catch (_) { return ''; }
    }

    function sanitizeRichTextFragment(html) {
      const allowed = new Set(['A','B','BLOCKQUOTE','BR','CODE','DIV','EM','I','IMG','LI','OL','P','PRE','S','SPAN','STRIKE','STRONG','U','UL']);
      const template = document.createElement('template');
      const source = String(html || '');
      if (!/<\/?[a-z][\s\S]*>/i.test(source)) {
        const text = document.createElement('div');
        text.textContent = source;
        text.style.whiteSpace = 'pre-wrap';
        template.content.append(text);
        return template.content;
      }
      template.innerHTML = source;
      Array.from(template.content.querySelectorAll('*')).reverse().forEach((node) => {
        if (!allowed.has(node.tagName)) {
          node.replaceWith(...Array.from(node.childNodes));
          return;
        }
        const allowedAttributes = node.tagName === 'A'
          ? new Set(['href','target','rel'])
          : node.tagName === 'IMG' ? new Set(['src','alt','data-qa-asset']) : new Set();
        Array.from(node.attributes).forEach((attribute) => {
          if (!allowedAttributes.has(attribute.name.toLowerCase())) node.removeAttribute(attribute.name);
        });
        if (node.tagName === 'A') {
          const href = safeLink(node.getAttribute('href'));
          if (!href) node.removeAttribute('href');
          else { node.setAttribute('href',href); node.setAttribute('target','_blank'); node.setAttribute('rel','noopener noreferrer'); }
        }
        if (node.tagName === 'IMG') {
          const assetPath = node.getAttribute('data-qa-asset') || '';
          const sourceUrl = node.getAttribute('src') || '';
          if (!assetPath && !/^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(sourceUrl)) node.remove();
          else { node.setAttribute('alt',node.getAttribute('alt') || 'Attached image'); if (assetPath) node.removeAttribute('src'); }
        }
      });
      return template.content;
    }

    function sanitizeRichTextHtml(html) {
      const container = document.createElement('div');
      container.append(sanitizeRichTextFragment(html));
      return container.innerHTML.trim();
    }

    function plainTextFromRichText(html) {
      const container = document.createElement('div');
      container.append(sanitizeRichTextFragment(html));
      return (container.textContent || '').replace(/\s+/g,' ').trim();
    }

    async function renderRichText(container, html) {
      container.replaceChildren(sanitizeRichTextFragment(html));
      container.classList.add('rich-content');
      const images = Array.from(container.querySelectorAll('img[data-qa-asset]'));
      await Promise.all(images.map(async (image) => {
        try { image.src = await fetchPrivateImage(image.dataset.qaAsset); }
        catch (_) { image.replaceWith(document.createTextNode('[Attached image unavailable]')); }
      }));
    }

    async function compressImageFile(file) {
      if (!file.type.startsWith('image/')) throw new Error('Only image files can be attached.');
      if (file.size > 20 * 1024 * 1024) throw new Error('Images must be smaller than 20 MB before compression.');
      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve,reject) => {
          const node = new Image(); node.onload=()=>resolve(node); node.onerror=()=>reject(new Error('The image could not be decoded.')); node.src=objectUrl;
        });
        const scale = Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(image.naturalWidth*scale)); canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
        const context=canvas.getContext('2d',{alpha:true}); if(!context) throw new Error('Image compression is unavailable.');
        context.imageSmoothingEnabled=true; context.imageSmoothingQuality='high'; context.drawImage(image,0,0,canvas.width,canvas.height);
        const blob=await new Promise((resolve,reject)=>canvas.toBlob((value)=>value?resolve(value):reject(new Error('Image compression failed.')),'image/webp',.78));
        if(blob.size>5*1024*1024) throw new Error('The compressed image is still larger than 5 MB.');
        return blob;
      } finally { URL.revokeObjectURL(objectUrl); }
    }

    async function blobToDataUrl(blob) {
      return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('The image could not be read.'));reader.readAsDataURL(blob);});
    }

    async function uploadRichTextAssets(html, scope) {
      const container=document.createElement('div'); container.innerHTML=sanitizeRichTextHtml(html);
      const images=Array.from(container.querySelectorAll('img'));
      for(let index=0;index<images.length;index+=1){
        const image=images[index]; if(image.dataset.qaAsset){image.removeAttribute('src');continue;}
        const source=image.getAttribute('src')||''; if(!source.startsWith('data:image/')){image.remove();continue;}
        const blob=await(await fetch(source)).blob();
        const objectPath=`sites/${state.site}/${state.masterId}/assets/${scope}-${Date.now()}-${Math.random().toString(36).slice(2,7)}-${index}.webp`;
        const expiresAt=state.snapshot?.expires_at; if(!expiresAt) throw new Error('The capture expiry is unavailable.');
        await api('/rest/v1/qa_snapshot_assets?on_conflict=object_path',{
          method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify({site_slug:state.site,master_id:state.masterId,object_path:objectPath,expires_at:expiresAt,updated_at:new Date().toISOString()}),
        });
        const encoded=objectPath.split('/').map(encodeURIComponent).join('/');
        const response=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encoded}`,{method:'POST',headers:{...headers(),'Content-Type':'image/webp','x-upsert':'false'},body:blob});
        if(!response.ok){let detail='';try{const body=await response.json();detail=body.message||body.error||'';}catch(_){}throw new Error(detail||`Image upload returned ${response.status}.`);}
        image.dataset.qaAsset=objectPath; image.removeAttribute('src'); image.alt=image.alt||'Attached image';
      }
      return container.innerHTML;
    }

    async function loadMetadata() {
      if (!state.site || !state.masterId) throw new Error('This snapshot link is incomplete.');
      const rows = await api(`/rest/v1/qa_snapshots?select=site_slug,master_id,item_number,title,notes,color,object_path,annotations,expires_at&site_slug=eq.${filter(state.site)}&master_id=eq.${filter(state.masterId)}&item_number=eq.${state.itemNumber}&limit=1`);
      if (!Array.isArray(rows) || !rows[0]) throw new Error('This capture was not uploaded, has expired, or no longer exists.');
      state.snapshot = rows[0];
      const rawAnnotations = Array.isArray(rows[0].annotations) ? rows[0].annotations : [];
      const inspectionManifest = rawAnnotations.find((entry) => entry?.kind === 'inspection-manifest');
      state.inspections = Array.isArray(inspectionManifest?.overlays) ? inspectionManifest.overlays : [];
      state.annotations = rawAnnotations.filter((entry) => entry?.kind !== 'inspection-manifest');
      state.activeAnnotationId = state.itemNumber > 0
        ? String(state.annotations[0]?.id || `item-${state.itemNumber}`)
        : String(state.annotations[0]?.id || 'master');
    }

    async function loadStatuses() {
      // Status belongs to the annotation itself, so master and cropped-item
      // links intentionally share the same item_number=0 status namespace.
      const rows = await api(`/rest/v1/qa_annotation_statuses?select=annotation_id,status,completed,completed_by,updated_at&site_slug=eq.${filter(state.site)}&master_id=eq.${filter(state.masterId)}&item_number=eq.0`);
      state.statuses = Object.fromEntries((rows || []).map((row) => [String(row.annotation_id), row]));
    }

    async function fetchPrivateImage(objectPath) {
      const encodedPath = String(objectPath).split('/').map(encodeURIComponent).join('/');
      const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodedPath}`, { headers: headers() });
      if (!response.ok) {
        let detail = '';
        try { const body = await response.json(); detail = body.message || body.error || ''; } catch (_) {}
        throw new Error(detail || `Capture download returned ${response.status}.`);
      }
      const blob = await response.blob();
      if (!blob.type.startsWith('image/')) throw new Error('The stored capture is not a valid image.');
      const objectUrl = URL.createObjectURL(blob);
      state.objectUrls.add(objectUrl);
      return objectUrl;
    }

    function annotationPercentRect(annotation, image) {
      if (
        annotation?.coordinateSpace === 'page' &&
        Number.isFinite(annotation.xPx) && Number.isFinite(annotation.yPagePx) &&
        Number.isFinite(annotation.widthPx) && Number.isFinite(annotation.heightPx)
      ) {
        const viewportWidth = Math.max(1, Number(annotation.viewportWidth) || image.naturalWidth);
        const captureScale = image.naturalWidth / viewportWidth;
        return {
          left: annotation.xPx * captureScale / image.naturalWidth * 100,
          top: annotation.yPagePx * captureScale / image.naturalHeight * 100,
          width: annotation.widthPx * captureScale / image.naturalWidth * 100,
          height: annotation.heightPx * captureScale / image.naturalHeight * 100,
        };
      }
      const rect = annotation?.rectPct || {};
      return { left:Number(rect.x)||0, top:Number(rect.y)||0, width:Number(rect.width)||0, height:Number(rect.height)||0 };
    }

    function inspectionPercentRect(overlay, image) {
      if (overlay?.coordinateSpace === 'image-percent' && overlay.rectPct) {
        const rect = overlay.rectPct;
        return { left:Number(rect.x)||0, top:Number(rect.y)||0, width:Number(rect.width)||0, height:Number(rect.height)||0 };
      }
      const viewportWidth = Math.max(1, Number(overlay?.viewportWidth) || image.naturalWidth);
      const captureScale = image.naturalWidth / viewportWidth;
      return {
        left:(Number(overlay?.xPx)||0) * captureScale / image.naturalWidth * 100,
        top:(Number(overlay?.yPagePx)||0) * captureScale / image.naturalHeight * 100,
        width:(Number(overlay?.widthPx)||0) * captureScale / image.naturalWidth * 100,
        height:(Number(overlay?.heightPx)||0) * captureScale / image.naturalHeight * 100,
      };
    }

    function renderInspectionOverlays() {
      const layer = el('inspectionLayer');
      const image = el('image');
      layer.replaceChildren();
      state.inspections.forEach((overlay, index) => {
        const rect = inspectionPercentRect(overlay, image);
        const item = document.createElement('div');
        item.className = `inspection-overlay ${overlay.kind || 'boundary'}`;
        item.dataset.inspectionId = String(overlay.id || `inspection-${index}`);
        item.style.left = `${rect.left}%`; item.style.top = `${rect.top}%`;
        item.style.width = `${rect.width}%`; item.style.height = `${rect.height}%`;
        if ((overlay.kind === 'font' || overlay.kind === 'boundary') && overlay.text) {
          const badge = document.createElement('span');
          badge.textContent = overlay.text;
          item.append(badge);
        }
        layer.append(item);
      });
    }

    function annotationStatus(annotationId) {
      const record = state.statuses[String(annotationId)];
      if (STATUS_OPTIONS.some((option) => option.value === record?.status)) return record.status;
      return record?.completed === true ? 'completed' : 'requested';
    }

    function statusDefinition(status) {
      return STATUS_OPTIONS.find((option) => option.value === status) || STATUS_OPTIONS[0];
    }

    function applyStatusStyle(node, annotationId) {
      const definition = statusDefinition(annotationStatus(annotationId));
      node.style.setProperty('--status-color', definition.color);
      node.style.setProperty('--status-foreground', definition.foreground);
      node.dataset.status = definition.value;
      const select = node.matches?.('.status-select') ? node : node.querySelector?.('.status-select');
      if (select) select.value = definition.value;
    }

    function updateActiveStatusBadge() {
      const definition = statusDefinition(annotationStatus(state.activeAnnotationId));
      const badge = el('badge');
      badge.style.color = definition.color;
      badge.style.borderColor = definition.color;
      badge.style.backgroundColor = `${definition.color}22`;
    }

    function updateStatusAppearance(annotationId) {
      document.querySelectorAll(`[data-annotation-id="${CSS.escape(String(annotationId))}"]`).forEach((node) => {
        applyStatusStyle(node, annotationId);
      });
      if (String(annotationId) === state.activeAnnotationId) updateActiveStatusBadge();
    }

    function scrollToAnnotation(annotationId) {
      const box = el('annotationLayer').querySelector(`[data-annotation-id="${CSS.escape(String(annotationId))}"]`);
      const target = box || el('stage');
      target.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' });
      target.classList.remove('pulse');
      requestAnimationFrame(() => {
        target.classList.add('pulse');
        setTimeout(() => target.classList.remove('pulse'), 1250);
      });
    }

    function setActiveAnnotation(annotation, shouldScroll = false) {
      state.activeAnnotationId = String(annotation?.id || (state.itemNumber ? `item-${state.itemNumber}` : 'master'));
      document.querySelectorAll('[data-annotation-id]').forEach((node) => node.classList.toggle('active', node.dataset.annotationId === state.activeAnnotationId));
      el('commentContext').textContent = annotation?.title ? `Discussion for “${annotation.title}”` : 'Discussion for this capture';
      const description = annotation?.notes || state.snapshot?.notes || '';
      el('notes').hidden = !description;
      if (description) void renderRichText(el('notes'), description);
      updateActiveStatusBadge();
      if (shouldScroll) scrollToAnnotation(state.activeAnnotationId);
      void loadComments();
    }

    async function setAnnotationStatus(annotationId, status) {
      const previous = state.statuses[annotationId];
      const definition = statusDefinition(status);
      const changedBy = el('author').value.trim() || localStorage.getItem('qa-comment-author') || 'Anonymous reviewer';
      const updatedAt = new Date().toISOString();
      state.statuses[annotationId] = { annotation_id:annotationId, status:definition.value, completed:definition.value === 'completed', completed_by:changedBy, updated_at:updatedAt };
      updateStatusAppearance(annotationId);
      try {
        await api('/rest/v1/qa_annotation_statuses?on_conflict=site_slug,master_id,item_number,annotation_id', {
          method:'POST',
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
          body:JSON.stringify({ site_slug:state.site, master_id:state.masterId, item_number:0, annotation_id:annotationId, status:definition.value, completed:definition.value === 'completed', completed_by:changedBy, updated_at:updatedAt }),
        });
        showToast(`Status changed to ${definition.label}`);
      } catch (error) {
        if (previous) state.statuses[annotationId] = previous; else delete state.statuses[annotationId];
        updateStatusAppearance(annotationId);
        showToast(error.message || 'Status could not be updated');
      }
    }

    function addAnnotationChoice(picker, annotation, index) {
      const id = String(annotation?.id || (state.itemNumber ? `item-${state.itemNumber}` : `annotation-${index + 1}`));
      const choice = document.createElement('div');
      choice.className = 'annotation-choice';
      choice.dataset.annotationId = id;

      const jump = document.createElement('button');
      jump.className = 'annotation-jump';
      jump.textContent = `#${annotation?.badgeNumber || state.itemNumber || index + 1} ${annotation?.title || 'Annotation'}`;
      jump.addEventListener('click', () => setActiveAnnotation(annotation, true));

      const select = document.createElement('select');
      select.className = 'status-select';
      select.setAttribute('aria-label', `Status for ${annotation?.title || 'annotation'}`);
      select.title = 'Change annotation status';
      STATUS_OPTIONS.forEach((definition) => {
        const option = document.createElement('option');
        option.value = definition.value;
        option.textContent = definition.label;
        select.append(option);
      });
      select.value = annotationStatus(id);
      select.addEventListener('change', () => void setAnnotationStatus(id, select.value));
      choice.append(jump, select);
      applyStatusStyle(choice, id);
      picker.append(choice);
    }

    function renderAnnotations() {
      const layer = el('annotationLayer');
      const picker = el('annotationPicker');
      layer.replaceChildren();
      picker.replaceChildren();
      const image = el('image');

      if (state.itemNumber > 0 || state.annotations.length === 0) {
        const annotation = state.annotations[0] || { id:state.itemNumber ? `item-${state.itemNumber}` : 'master', badgeNumber:state.itemNumber || 1, title:state.snapshot?.title || 'Capture' };
        addAnnotationChoice(picker, annotation, 0);
        setActiveAnnotation(annotation);
        return;
      }

      state.annotations.forEach((annotation, index) => {
        const id = String(annotation.id || `annotation-${index + 1}`);
        const rect = annotationPercentRect(annotation, image);
        const box = document.createElement('button');
        box.className = `annotation ${annotation.type || 'box'}`;
        box.dataset.annotationId = id;
        applyStatusStyle(box, id);
        box.style.left = `${rect.left}%`; box.style.top = `${rect.top}%`;
        box.style.width = `${rect.width}%`; box.style.height = `${rect.height}%`;
        box.setAttribute('aria-label', annotation.title || `Annotation ${index + 1}`);
        renderAnnotationShape(box, annotation);
        const label = document.createElement('span');
        label.className = 'annotation-label';
        label.textContent = `#${annotation.badgeNumber || index + 1} ${annotation.title || 'Annotation'}`;
        box.append(label);
        box.addEventListener('click', () => setActiveAnnotation(annotation));
        layer.append(box);

        addAnnotationChoice(picker, annotation, index);
      });
      setActiveAnnotation(state.annotations[0]);
    }

    function renderAnnotationShape(box, annotation) {
      const type = annotation?.type || 'box';
      const svgNode = (name) => document.createElementNS('http://www.w3.org/2000/svg', name);
      if (type === 'arrow') {
        const arrow = annotation.arrowPct || { startX:0, startY:100, endX:100, endY:0 };
        const svg = svgNode('svg'); svg.setAttribute('class','annotation-shape-svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
        const line = svgNode('line'); line.setAttribute('x1',arrow.startX); line.setAttribute('y1',arrow.startY); line.setAttribute('x2',arrow.endX); line.setAttribute('y2',arrow.endY); line.setAttribute('data-status-stroke',''); line.setAttribute('stroke-width','3'); line.setAttribute('vector-effect','non-scaling-stroke');
        const dx = arrow.endX-arrow.startX; const dy = arrow.endY-arrow.startY; const length = Math.max(1,Math.hypot(dx,dy)); const ux=dx/length; const uy=dy/length; const px=-uy; const py=ux;
        const head = svgNode('polygon'); head.setAttribute('points',`${arrow.endX},${arrow.endY} ${arrow.endX-ux*10+px*5},${arrow.endY-uy*10+py*5} ${arrow.endX-ux*10-px*5},${arrow.endY-uy*10-py*5}`); head.setAttribute('data-status-fill','');
        svg.append(line,head); box.append(svg);
      } else if (type === 'pen') {
        const svg = svgNode('svg'); svg.setAttribute('class','annotation-shape-svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('preserveAspectRatio','none');
        const line = svgNode('polyline'); line.setAttribute('points',(annotation.pointsPct||[]).map((point)=>`${point.x},${point.y}`).join(' ')); line.setAttribute('fill','none'); line.setAttribute('data-status-stroke',''); line.setAttribute('stroke-width','3'); line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round'); line.setAttribute('vector-effect','non-scaling-stroke');
        svg.append(line); box.append(svg);
      } else if (type === 'text') {
        const text = document.createElement('span'); text.className='annotation-shape-text'; text.textContent=plainTextFromRichText(annotation.notes)||annotation.title||'Text note'; box.append(text);
      } else if (type === 'blur') {
        const blur = document.createElement('span'); blur.className='annotation-shape-blur'; box.append(blur);
      }
    }

    function renderCaptureDimensions() {
      const annotation = state.annotations[0] || {};
      const viewportWidth = Number(params.get('vw')) || Number(annotation.viewportWidth) || 0;
      const viewportHeight = Number(params.get('vh')) || Number(annotation.viewportHeight) || 0;
      const image = el('image');
      const imageWidth = Number(params.get('iw')) || image.naturalWidth || 0;
      const imageHeight = Number(params.get('ih')) || image.naturalHeight || 0;
      const device = params.get('device') || annotation.deviceName || 'Captured viewport';
      const container = el('captureSize');
      container.replaceChildren();

      if (viewportWidth && viewportHeight) {
        const viewport = document.createElement('span');
        const label = document.createElement('strong');
        label.textContent = `${device}: `;
        viewport.append(label, document.createTextNode(`${viewportWidth} × ${viewportHeight} viewport`));
        container.append(viewport);
      }
      if (imageWidth && imageHeight) {
        const capture = document.createElement('span');
        capture.textContent = `${imageWidth} × ${imageHeight} ${state.itemNumber ? 'shared crop' : 'full capture'}`;
        container.append(capture);
      }
      container.hidden = container.childElementCount === 0;
    }

    async function showImage() {
      const image = el('image');
      const queryImage = params.get('img');
      let source = queryImage || '';
      if (!source && state.snapshot?.object_path) source = await fetchPrivateImage(state.snapshot.object_path);

      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('The capture URL could not be loaded.'));
        image.src = source;
      }).catch(async (originalError) => {
        if (!state.snapshot?.object_path || state.objectUrls.has(source)) throw originalError;
        image.src = await fetchPrivateImage(state.snapshot.object_path);
        await image.decode();
      });

      el('message').hidden = true;
      el('stage').hidden = false;
      renderInspectionOverlays();
      renderAnnotations();
      renderCaptureDimensions();
    }

    function renderMetadata() {
      const snapshot = state.snapshot || {};
      const queryTitle = params.get('title');
      const queryNotes = params.get('notes');
      el('path').textContent = `${state.site} / ${state.masterId}${state.itemNumber ? ` / item-${state.itemNumber}` : ''}`;
      el('title').textContent = snapshot.title || queryTitle || (state.itemNumber ? `QA Item #${state.itemNumber}` : 'Full-site QA capture');
      el('badge').textContent = state.itemNumber ? `#${state.itemNumber} ANNOTATION` : `${state.annotations.length} ANNOTATIONS`;
      updateActiveStatusBadge();
      const notes = snapshot.notes || queryNotes || '';
      el('notes').hidden = !notes;
      if (notes) void renderRichText(el('notes'), notes);
      const expiresAt = snapshot.expires_at || params.get('expires');
      el('expiry').textContent = expiresAt ? `Expires ${new Date(expiresAt).toLocaleString()}` : '';
    }

    async function loadComments() {
      const comments = el('comments');
      comments.innerHTML = '<div class="empty">Loading comments…</div>';
      try {
        const rows = await api(`/rest/v1/qa_annotation_comments?select=id,author_name,body,created_at&site_slug=eq.${filter(state.site)}&master_id=eq.${filter(state.masterId)}&item_number=eq.${state.itemNumber}&annotation_id=eq.${filter(state.activeAnnotationId)}&order=created_at.asc`);
        comments.replaceChildren();
        if (!rows.length) comments.innerHTML = '<div class="empty">No comments yet. Start the discussion.</div>';
        rows.forEach((comment) => {
          const card = document.createElement('article'); card.className = 'comment';
          const head = document.createElement('div'); head.className = 'comment-head';
          const author = document.createElement('span'); author.className = 'comment-author'; author.textContent = comment.author_name;
          const time = document.createElement('time'); time.className = 'comment-time'; time.textContent = new Date(comment.created_at).toLocaleString();
          const body = document.createElement('div'); body.className = 'comment-body rich-content'; void renderRichText(body, comment.body);
          head.append(author,time); card.append(head,body); comments.append(card);
        });
      } catch (error) {
        comments.replaceChildren();
        const message = document.createElement('div');
        message.className = 'empty';
        message.textContent = error.message || 'Comments could not be loaded.';
        comments.append(message);
      }
    }

    el('commentForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const author = el('author').value.trim();
      const rawBody = sanitizeRichTextHtml(el('commentBody').innerHTML);
      if (!author || (!plainTextFromRichText(rawBody) && !rawBody.includes('<img'))) return;
      if (rawBody.length > 50000) { el('formStatus').className='form-status error'; el('formStatus').textContent='The formatted comment is too long.'; return; }
      const status = el('formStatus'); const submit = el('submitComment');
      status.className = 'form-status'; status.textContent = 'Posting…'; submit.disabled = true;
      try {
        const body = await uploadRichTextAssets(rawBody, `comment-${state.activeAnnotationId.replace(/[^a-z0-9_-]/gi,'-')}`);
        await api('/rest/v1/qa_annotation_comments', {
          method:'POST', headers:{Prefer:'return=minimal'},
          body:JSON.stringify({ site_slug:state.site, master_id:state.masterId, item_number:state.itemNumber, annotation_id:state.activeAnnotationId, author_name:author, body }),
        });
        localStorage.setItem('qa-comment-author', author); el('commentBody').innerHTML = '';
        status.className = 'form-status success'; status.textContent = 'Comment posted.';
        await loadComments();
      } catch (error) {
        status.className = 'form-status error'; status.textContent = error.message;
      } finally { submit.disabled = false; }
    });

    el('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); showToast('Link copied'); }
      catch (_) { showToast('Clipboard access was blocked'); }
    });
    el('author').value = localStorage.getItem('qa-comment-author') || '';

    let savedCommentRange = null;
    function rememberCommentSelection() {
      const selection=window.getSelection();
      if(selection?.rangeCount&&el('commentBody').contains(selection.anchorNode)) savedCommentRange=selection.getRangeAt(0).cloneRange();
    }
    function restoreCommentSelection() {
      const editor=el('commentBody'); editor.focus();
      const range=savedCommentRange||document.createRange();
      if(!savedCommentRange){range.selectNodeContents(editor);range.collapse(false);}
      const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range); return range;
    }
    async function addCommentImages(files) {
      if(!files.length)return; rememberCommentSelection(); el('richStatus').textContent='Compressing image…';
      try{
        for(const file of files){
          const dataUrl=await blobToDataUrl(await compressImageFile(file)); const range=restoreCommentSelection();
          const image=document.createElement('img'); image.src=dataUrl; image.alt=file.name||'Attached image'; range.deleteContents(); range.insertNode(image);
          const spacer=document.createElement('br'); image.after(spacer); range.setStartAfter(spacer); range.collapse(true); savedCommentRange=range.cloneRange();
        }
        el('richStatus').textContent='Image compressed and attached';
      }catch(error){el('richStatus').textContent=error.message||'Image attachment failed.';}
      setTimeout(()=>{el('richStatus').textContent='';},2600);
    }
    el('commentToolbar').querySelectorAll('[data-command]').forEach((button)=>{
      button.addEventListener('mousedown',(event)=>event.preventDefault());
      button.addEventListener('click',()=>{restoreCommentSelection();document.execCommand(button.dataset.command,false);rememberCommentSelection();});
    });
    el('commentBody').addEventListener('keyup',rememberCommentSelection);
    el('commentBody').addEventListener('mouseup',rememberCommentSelection);
    el('commentBody').addEventListener('paste',(event)=>{
      const files=Array.from(event.clipboardData.files||[]).filter((file)=>file.type.startsWith('image/'));
      if(files.length){event.preventDefault();void addCommentImages(files);}
    });
    el('commentImage').addEventListener('mousedown',(event)=>event.preventDefault());
    el('commentImage').addEventListener('click',()=>{rememberCommentSelection();el('commentImageInput').click();});
    el('commentImageInput').addEventListener('change',(event)=>{void addCommentImages(Array.from(event.target.files||[]));event.target.value='';});
    el('commentLink').addEventListener('mousedown',(event)=>event.preventDefault());
    el('commentLink').addEventListener('click',()=>{
      rememberCommentSelection(); el('linkText').value=window.getSelection()?.toString()||''; el('linkUrl').value=''; el('linkDialog').hidden=false; el('linkText').focus();
    });
    el('cancelLink').addEventListener('click',()=>{el('linkDialog').hidden=true;});
    const applyCommentLink=()=>{
      const href=safeLink(el('linkUrl').value); if(!href){el('linkUrl').focus();return;}
      const range=restoreCommentSelection(); const anchor=document.createElement('a'); anchor.href=href; anchor.target='_blank'; anchor.rel='noopener noreferrer'; anchor.textContent=el('linkText').value.trim()||href;
      range.deleteContents(); range.insertNode(anchor); range.setStartAfter(anchor); range.collapse(true); savedCommentRange=range.cloneRange(); el('linkDialog').hidden=true;
    };
    el('applyLink').addEventListener('click',applyCommentLink);
    el('linkUrl').addEventListener('keydown',(event)=>{if(event.key==='Enter'){event.preventDefault();applyCommentLink();}});

    function requestExpiredAssetCleanup() {
      const key='qa-expired-asset-cleanup'; const previous=Number(localStorage.getItem(key)||0); if(Date.now()-previous<6*60*60*1000)return;
      void (async()=>{
        try{
          const rows=await api('/rest/v1/rpc/list_expired_qa_object_paths',{method:'POST',body:JSON.stringify({batch_size:100})});
          const paths=(rows||[]).map((row)=>row.object_path).filter(Boolean);
          if(paths.length){
            const response=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}`,{method:'DELETE',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({prefixes:paths})});
            if(!response.ok)throw new Error(`Expired asset cleanup returned ${response.status}.`);
            await api('/rest/v1/rpc/finalize_expired_qa_cleanup',{method:'POST',body:JSON.stringify({object_paths:paths})});
          }
          localStorage.setItem(key,String(Date.now()));
        }catch(_){}
      })();
    }

    async function initialize() {
      el('commentForm').querySelectorAll('input,button').forEach((node) => node.disabled = false);
      el('commentBody').setAttribute('contenteditable','true');
      try {
        await loadMetadata();
        requestExpiredAssetCleanup();
        await loadStatuses();
        renderMetadata();
        await showImage();
      } catch (error) {
        // A current signed URL may still render while metadata is temporarily unavailable.
        if (params.get('img')) {
          state.annotations = [];
          renderMetadata();
          try { await showImage(); return; } catch (_) {}
        }
        showError(error.message || 'The snapshot could not be loaded.', initialize);
        el('commentForm').querySelectorAll('input,button').forEach((node) => node.disabled = true);
        el('commentBody').setAttribute('contenteditable','false');
      }
    }

    document.addEventListener('click', (event) => {
      const image = event.target instanceof Element
        ? event.target.closest('.rich-content img, #image')
        : null;
      if (!(image instanceof HTMLImageElement)) return;
      event.preventDefault();
      openImageLightbox(image);
    });
    el('closeLightbox').addEventListener('click', closeImageLightbox);
    el('imageLightbox').addEventListener('click', (event) => {
      if (event.target === el('imageLightbox') || event.target?.classList?.contains('lightbox-image-wrap')) {
        closeImageLightbox();
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeImageLightbox();
    });

    addEventListener('beforeunload', () => { state.objectUrls.forEach((url) => URL.revokeObjectURL(url)); });
    void initialize();
  </script>
</body>
</html>
